name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      # dist/ is committed so consumers install it as plain files with no
      # build-script execution; fail if it drifts from src/.
      - name: Build and verify committed dist is up to date
        run: |
          pnpm build
          git add -A dist
          git diff --cached --exit-code -- dist
