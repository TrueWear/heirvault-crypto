name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate the publish behind a reviewer. Any tag push reaches this workflow,
    # so without an approval step whoever can push a `v*.*.*` tag can ship
    # whatever that tag points at to every consumer.
    # NOTE: this only enforces anything once the `npm-publish` environment has
    # required reviewers configured in the repository settings; GitHub
    # silently creates an unprotected environment otherwise.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history to prove the tagged commit is on main, below.
          fetch-depth: 0
      - name: Verify the tag is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main."
            echo "Publishing it would ship code that never passed review."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      # dist/ is committed so consumers install it as plain files with no
      # build-script execution; fail if it drifts from src/ (mirrors ci.yml,
      # re-checked here since a tag push doesn't re-run the branch-push CI).
      - name: Build and verify committed dist is up to date
        run: |
          pnpm build
          git add -A dist
          git diff --cached --exit-code -- dist
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
